# Forget cached passphrases after 1 hour of inactivity
default-cache-ttl 3600

# Hard limit: always re-prompt after 4 hours regardless of activity
max-cache-ttl 14400

# Use GPG Suite's native macOS pinentry for passphrase prompts
pinentry-program /usr/local/MacGPG2/libexec/pinentry-mac.app/Contents/MacOS/pinentry-mac
