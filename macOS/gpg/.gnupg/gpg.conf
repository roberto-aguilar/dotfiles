# Fetch missing public keys from keyservers automatically during verification
auto-key-retrieve

# Omit GPG version from signatures and encrypted messages
no-emit-version

# Sign with this key when --local-user is not specified
default-key E19E54A71CC6CCEE

# Output text (base64) by default instead of binary
armor

# Show 16-character key IDs to avoid collisions possible with short (8-char) IDs
keyid-format long

# Always display full fingerprints in key listings
with-fingerprint

# Prefer the strongest ciphers and digests when GPG has a choice
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256

# Use SHA512 for key certifications (some older GPG versions default to SHA1)
cert-digest-algo SHA512
