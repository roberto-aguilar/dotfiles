# Temporary backport of mainline commit 7adde1e5216e ("Bluetooth: btusb: Add
# USB ID 13d3:3556 for RTL8821CE"), first released in v7.4-rc1. Once a stock
# btusb carries the ID, prepare-source refuses to build and says to remove this.
PACKAGE_NAME="btusb-rtl8821ce"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="btusb"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# The package ships no kernel source. prepare-source downloads the matching
# kernel.org release for each kernel and leaves a patched btusb.c behind.
PRE_BUILD="prepare-source ${kernelver}"
MAKE[0]="make KERNEL_BUILD_DIRECTORY=${kernel_source_dir}"

AUTOINSTALL="yes"
